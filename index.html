<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Анимация входящего сообщения</title>
<link rel="stylesheet" href="chat.css">
<main>
  <header><span class="avatar" aria-hidden="true">С</span><div><h1>Собеседник</h1><small id="status">в сети</small></div></header>
  <section id="history" role="log" aria-label="Входящие сообщения" aria-live="polite">
    <div class="thread"><p class="message outgoing">Привет!</p></div>
  </section>
  <form>
    <label for="draft">От лица собеседника</label>
    <div class="composer"><textarea id="draft" rows="2" placeholder="Введите сообщение…" maxlength="4096"></textarea><button type="submit" aria-label="Отправить" disabled>↑</button></div>
  </form>
</main>
<script src="bubble.js"></script>
</html>
